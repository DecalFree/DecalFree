name: Metrics

on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: DecalFree

          template: classic
          base: ""
          config_timezone: Etc/UTC
          config_order: languages
          config_display: large
          config_padding: 10,20

          optimize: yes
          retries: 2
          retries_delay: 120
          optimize_repositories: 5

          plugin_languages: yes
          plugin_languages_ignored: html, ejs, json
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 20
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14
          plugin_languages_categories: programming
          plugin_languages_analysis_timeout_repositories: 2m

          config_theme: dark
          config_twemoji: yes

          repositories_affiliations: owner, collaborator, organization_member
